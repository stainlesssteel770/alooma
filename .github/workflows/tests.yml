name: Tests

# Manual trigger only (Actions tab -> Tests -> Run workflow).
# Read-only, no secrets: every suite mocks the GitHub API and runs on
# sample data, so runs and logs can stay public with the repo.
#
# Fix-round item 2 (2026-10-26): the suites run as 4 parallel jobs
# instead of one sequential chain, so a full run lands in ~4 min
# instead of ~13 and one shard's failure never skips the others.
# The run is green only when ALL shards are green. Each shard repeats
# checkout + Node + Puppeteer install on its own runner; the suites
# are independent (own ports, own seeds), so no cross-shard
# interference. Shard balance from the 2026-10-26 green run's step
# timings (slowest shard ~3.5 min of suites + install overhead).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard-print:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer (downloads its Chrome)
        run: npm install --no-save puppeteer@25.16.0 axe-core pdfjs-dist@4

      - name: Label-fit audit (item 9 — report only, never fails the build)
        run: node tests/label-fit.mjs

      - name: Recipe tests (editor sub-batches a+b — catalog migration + editor UI)
        run: node tests/test-recipes.mjs

      - name: Print checks (4x6 PDFs, no blank labels)
        run: node tests/check-print.mjs

      # Fix-round item 1 leak probe: count chrome processes and free
      # memory right before print-done. The pre-print-done suites all
      # close their browsers in finally, so a nonzero count here proves
      # a leak (or a runner-level problem); zero rules leaks out.
      - name: Chrome count + memory before print-done (leak probe)
        run: |
          echo "chrome processes: $(ps aux | grep '[c]hrome' | wc -l)"
          ps aux | grep '[c]hrome' | awk '{print $2, $3, $4, $11, $12}' | head -20 || true
          free -m

      - name: Print-done tests (A4 print completes orders)
        run: node tests/test-printdone.mjs

  shard-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer (downloads its Chrome)
        run: npm install --no-save puppeteer@25.16.0 axe-core pdfjs-dist@4

      - name: Redesign tests (Packing chips/Queue mode/Names/Clear-all header/walk)
        run: node tests/test-redesign.mjs

      - name: Queue tests (multi-craft packing queue)
        run: node tests/test-queue.mjs

      - name: Byline tests (Packed by / Counted by in Settings)
        run: node tests/test-byline.mjs

  shard-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer (downloads its Chrome)
        run: npm install --no-save puppeteer@25.16.0 axe-core pdfjs-dist@4

      - name: UI tests (real buttons, editor flows, Batch A safety)
        run: node tests/test-ui.mjs

      - name: Batch A tests (Bulk padding, toast, kits error, header, Bulk wording, Bulk toggle)
        run: node tests/test-batcha.mjs

      - name: Leave-rule tests (A3 unified tab guard)
        run: node tests/test-leaverule.mjs

      - name: Back-button tests (item 15 hash history)
        run: node tests/test-backbutton.mjs

      - name: Layout audit (real geometry at 360/390px — nothing clipped or off-screen)
        run: node tests/test-layout.mjs

      - name: Offline test (data blocked -> single empty state -> Retry)
        run: node tests/test-offline.mjs

      - name: Offline queue tests (v3 E4 — offline actions re-applied on reconnect)
        run: node tests/test-offline-queue.mjs

      - name: Service worker freshness (network-first app files, old caches deleted, offline fallback)
        run: node tests/test-sw.mjs

      - name: Accessibility scan (axe)
        run: node tests/test-a11y.mjs

  shard-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer (downloads its Chrome)
        run: npm install --no-save puppeteer@25.16.0 axe-core pdfjs-dist@4

      - name: Logic tests (stock math, recipes, history)
        run: node tests/test-logic.js

      - name: Screenshots at 390px (batch-report evidence)
        run: node tests/screenshots.mjs

      - name: Desktop screenshots (desktop brief — evidence at 768/1280/1440/1920)
        run: node tests/shots-desktop.mjs

      - name: Brief deliverables (3-craft Print all, single sheets ±BOXES, count sheet with name, phone screenshots)
        run: node tests/make-deliverables.mjs

      - name: Upload screenshots and print PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            screenshots/
            /tmp/alooma-*.pdf
          if-no-files-found: ignore
          retention-days: 14
